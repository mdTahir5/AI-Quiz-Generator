spring.application.name=ai-quiz-generator
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ai_quiz_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=9a7c3b2f5e8d1a4c6b8e0f2d4c6a8b0e2d4f6a8c0e2b4d6f8a0c2e4b6d8f0a2c
app.jwt.expiration-ms=86400000

# OpenRouter Configuration
# Provide OPENROUTER_API_KEY environment variable or leave blank to use high-fidelity intelligent fallback
app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.openrouter.base-url=https://openrouter.ai/api/v1
app.openrouter.model=${OPENROUTER_MODEL:google/gemini-2.0-flash-001}
app.openrouter.site-url=http://localhost:5173
app.openrouter.site-name=AI Quiz Generator
